services:
  backend:
    build:
      context: ./services/backend
    container_name: voiceops-backend-blue
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '127.0.0.1:18000:8000'
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - aether_net

  frontend:
    build:
      context: ./services/frontend
    container_name: voiceops-frontend-blue
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api/v1}
    ports:
      - '127.0.0.1:13000:3000'
    networks:
      - aether_net

networks:
  aether_net:
    external: true
